<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="saved-section">
            <div class="saved-header">
                <h2 class="section-title">History</h2>
                <div class="history-actions">
                    <button id="clearHistory" type="button">Clear History</button>
                    <button id="backHome" type="button">Back</button>
                </div>
            </div>
            <div id="historyList" class="saved-list">
                <div class="saved-card">Loading history...</div>
            </div>
        </section>
    </main>
    <script src="history.js"></script>
</body>
</html>
